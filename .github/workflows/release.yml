name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.2.0)"
        required: true
        type: string
      version_code:
        description: "Version code (integer, must increase each release)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  SHERPA_ONNX_VERSION: "v1.13.4"
  JAVA_VERSION: "17"

jobs:
  build-and-release:
    name: Build APK/AAB and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download sherpa-onnx Android native libs
        run: |
          set -euo pipefail
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION#v}-android.tar.bz2"
          echo "Downloading $URL"
          curl -fsSL -o /tmp/sherpa-onnx-android.tar.bz2 "$URL"
          mkdir -p /tmp/sherpa-extract
          tar -xjf /tmp/sherpa-onnx-android.tar.bz2 -C /tmp/sherpa-extract
          # Archive layout: jniLibs/{abi}/*.so
          if [ -d /tmp/sherpa-extract/jniLibs ]; then
            cp -a /tmp/sherpa-extract/jniLibs/. app/src/main/jniLibs/
          else
            # fallback if tarball extracts to a versioned folder
            LIBROOT=$(find /tmp/sherpa-extract -type d -name jniLibs | head -n1)
            cp -a "$LIBROOT"/. app/src/main/jniLibs/
          fi
          find app/src/main/jniLibs -name '*.so' | sort
          test -f app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using production keystore from secrets"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret — release APK will be debug-signed"
          fi

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}" \
            --no-daemon

      - name: Build release AAB
        run: |
          ./gradlew bundleRelease \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}" \
            --no-daemon

      - name: Prepare artifacts
        id: artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${{ inputs.version_name }}"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -n1)
          test -n "$APK_SRC"
          test -n "$AAB_SRC"
          cp "$APK_SRC" "dist/WhisperTypeKeyboard-${VER}.apk"
          cp "$AAB_SRC" "dist/WhisperTypeKeyboard-${VER}.aab"
          ls -lh dist/
          echo "apk=dist/WhisperTypeKeyboard-${VER}.apk" >> "$GITHUB_OUTPUT"
          echo "aab=dist/WhisperTypeKeyboard-${VER}.aab" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: WhisperType ${{ inputs.version_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## WhisperType ${{ inputs.version_name }}

            - **versionCode:** `${{ inputs.version_code }}`
            - **Offline ASR:** Parakeet 110M (recommended) + Whisper Tiny.en
            - **Native runtime:** sherpa-onnx ${{ env.SHERPA_ONNX_VERSION }}

            ### Install
            1. Download `WhisperTypeKeyboard-${{ inputs.version_name }}.apk`
            2. Install on device (`adb install -r …` or open the APK)
            3. Enable keyboard → grant mic → download a model in settings

            ### Artifacts
            | File | Use |
            |------|-----|
            | `.apk` | Sideload / direct install |
            | `.aab` | Play Store upload |
          files: |
            dist/WhisperTypeKeyboard-${{ inputs.version_name }}.apk
            dist/WhisperTypeKeyboard-${{ inputs.version_name }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
