name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  build-and-release:
    name: Build APK/AAB and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using production keystore from secrets"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret — release APK will be debug-signed"
          fi

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Read committed version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Prepare artifacts
        id: artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="$VERSION_NAME"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -n1)
          test -n "$APK_SRC"
          test -n "$AAB_SRC"
          cp "$APK_SRC" "dist/WhisperTypeKeyboard-${VER}.apk"
          cp "$AAB_SRC" "dist/WhisperTypeKeyboard-${VER}.aab"
          ls -lh dist/
          echo "apk=dist/WhisperTypeKeyboard-${VER}.apk" >> "$GITHUB_OUTPUT"
          echo "aab=dist/WhisperTypeKeyboard-${VER}.aab" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: WhisperType ${{ env.VERSION_NAME }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## WhisperType ${{ env.VERSION_NAME }}

            - **versionCode:** `${{ env.VERSION_CODE }}`
            - **Offline ASR:** Whisper Small English (int8)
            - **Runtime:** ONNX Runtime Android + Extensions (Maven Central)

            ### Install
            1. Download `WhisperTypeKeyboard-${{ env.VERSION_NAME }}.apk`
            2. Install on device (`adb install -r ...` or open the APK)
            3. Enable keyboard, grant mic access, and download the model in settings

            ### Artifacts
            | File | Use |
            |------|-----|
            | `.apk` | Sideload / direct install |
            | `.aab` | Play Store upload |
          files: |
            dist/WhisperTypeKeyboard-${{ env.VERSION_NAME }}.apk
            dist/WhisperTypeKeyboard-${{ env.VERSION_NAME }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
