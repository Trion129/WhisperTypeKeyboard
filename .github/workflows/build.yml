name: Build

on:
  push:
    branches: ["feat/fdroid-source-build", "main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  instrumented:
    name: IME integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          disable-linux-hw-accel: true
          script: './gradlew :app:connectedDebugAndroidTest --no-daemon || { s=$?; mkdir -p emulator-failure; adb -s emulator-5554 logcat -d > emulator-failure/emulator-5554-logcat.txt || true; exit "$s"; }'

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emoji-integration-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            emulator-failure/
          if-no-files-found: ignore

  build:
    needs: instrumented
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for val in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$val" ]; then
              echo "::error::Missing required signing secret — all four (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Verify APKs are signed
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)"
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== $apk ==="
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            found=1
          done
          test "$found" -eq 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhisperTypeKeyboard-release
          path: app/build/outputs/apk/release/*.apk
