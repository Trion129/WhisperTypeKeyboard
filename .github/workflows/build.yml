name: Build

on:
  push:
    branches: ["feat/fdroid-source-build", "main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build APK (source-built native deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK + NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install build tools (cmake 3.28+, ninja)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install cmake ninja

      - name: Cache native build artifacts
        id: cache-native
        uses: actions/cache@v4
        with:
          path: .native-build
          key: native-${{ hashFiles('scripts/fdroid-build-native.sh') }}

      - name: Build native deps (ONNX Runtime + sherpa-onnx JNI)
        run: bash scripts/fdroid-build-native.sh

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhisperTypeKeyboard-debug
          path: app/build/outputs/apk/debug/*.apk
