name: Build

on:
  push:
    branches: ["feat/fdroid-source-build", "main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  instrumented:
    name: IME integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Action default (`tools platform-tools`) is broken: the obsolete
          # `tools` package no longer exists in the SDK repository
          # (`Failed to find package 'tools'`). Install only platform-tools
          # here; platform + build-tools come via sdkmanager below.
          packages: platform-tools
      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'KVM unavailable; emulator will use software acceleration'
          fi

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew .github/scripts/ime-tests.sh

      # The CI emulator sometimes fails at boot, before our keyboard can show.
      # Up to 3 tries, each on a newly booted emulator. The logs of a failed
      # try are uploaded at once, so they can be read while the next try runs.
      - name: IME tests, try 1
        id: try1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          emulator-boot-timeout: 1200
          disable-animations: true
          script: .github/scripts/ime-tests.sh 1

      - name: Upload logs of try 1
        if: steps.try1.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ime-reports-try-1
          path: ime-reports/try-1/
          if-no-files-found: warn

      - name: IME tests, try 2
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          emulator-boot-timeout: 1200
          disable-animations: true
          script: .github/scripts/ime-tests.sh 2

      - name: Upload logs of try 2
        if: steps.try2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ime-reports-try-2
          path: ime-reports/try-2/
          if-no-files-found: warn

      # No continue-on-error: if this last try fails, the job fails.
      - name: IME tests, try 3
        id: try3
        if: steps.try2.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          emulator-boot-timeout: 1200
          disable-animations: true
          script: .github/scripts/ime-tests.sh 3

      - name: Upload logs of try 3
        if: always() && steps.try3.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ime-reports-try-3
          path: ime-reports/try-3/
          if-no-files-found: warn

  build:
    needs: instrumented
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          # Same as above: skip the removed `tools` package.
          packages: platform-tools

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for val in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$val" ]; then
              echo "::error::Missing required signing secret — all four (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Verify APKs are signed
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)"
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== $apk ==="
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            found=1
          done
          test "$found" -eq 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhisperTypeKeyboard-release
          path: app/build/outputs/apk/release/*.apk
